<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
:root{--primary:#FF6B2C;--primary-hover:color-mix(in oklab,var(--primary),#000 10%);--primary-text:color-mix(in oklab,var(--primary),#000 22%);--tint:color-mix(in srgb,var(--primary) 9%,#fff);--bg:#F6F7F9;--surface:#FFFFFF;--surface2:#F9FAFB;--border:#E4E7EC;--divider:#F0F2F5;--text:#101828;--text2:#475467;--muted:#667085;--muted2:#98A2B3;--navy:#092C4C;}
body.dark{--tint:color-mix(in srgb,var(--primary) 16%,#161B22);--primary-text:color-mix(in oklab,var(--primary),#fff 28%);--bg:#0D1117;--surface:#161B22;--surface2:#1C232C;--border:#2A323D;--divider:#232B35;--text:#E9EEF4;--text2:#B4BECA;--muted:#7D8896;--muted2:#5E6875;}
html,body{margin:0;padding:0;max-width:100vw;overflow-x:hidden;}
*{box-sizing:border-box;}
body{background:var(--bg);}
button{font-family:inherit;}
a{color:var(--text);text-decoration:none;}a:hover{color:var(--primary-text);}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;display:inline-block;user-select:none;}
.snav{width:252px;transition:width 200ms cubic-bezier(0.2,0,0,1);}
body.nav-collapsed .snav{width:76px;}
body.nav-collapsed .glabel,body.nav-collapsed .lbl,body.nav-collapsed .bdg,body.nav-collapsed .logo-word{display:none;}
body.nav-collapsed .gdiv{display:block;}
body.nav-collapsed .nvi{justify-content:center;padding-left:0;padding-right:0;}
.nvi{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:2px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);position:relative;transition:background-color 120ms cubic-bezier(0.2,0,0,1),color 120ms cubic-bezier(0.2,0,0,1);}
.nvi:hover{background:var(--divider);color:var(--text);}
.nvi.on,.nvi.on:hover{background:var(--tint);color:var(--primary-text);font-weight:700;}
.nvi.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--primary);}
.nvi .ms{font-size:20px;color:var(--muted);transition:color 120ms cubic-bezier(0.2,0,0,1);}
.nvi.on .ms{color:var(--primary);}
.nvi:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.gdiv{display:none;height:1px;background:var(--divider);margin:10px 14px 8px;}
.scroll-hidden{scrollbar-width:none;}.scroll-hidden::-webkit-scrollbar{display:none;}
</style>
</helmet>
<div data-screen-label="Layout shell" style="display:flex;height:100vh;overflow:hidden;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);">
  <aside class="snav" style="flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;height:64px;padding:0 12px;flex-shrink:0;">
      <img src="public/images/drim-d-transparent.png" alt="DRIM" style="width:32px;height:32px;object-fit:contain;flex-shrink:0;">
      <span class="logo-word" style="font-size:19px;font-weight:800;letter-spacing:-0.3px;white-space:nowrap;">DRIM <span style="color:var(--primary);">IMS</span></span>
    </div>
    <nav class="scroll-hidden" style="flex:1;overflow-y:auto;padding:0 12px 8px;">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
        <div>
          <div class="glabel" style="padding:16px 10px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted2);">{{ g.label }}</div>
          <div class="gdiv"></div>
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
            <div class="{{ it.cls }}" onClick="{{ it.go }}" title="{{ it.label }}" tabindex="0">
              <span class="ms">{{ it.icon }}</span>
              <span class="lbl" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ it.label }}</span>
              <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}">
                <span class="bdg" style="font-size:11px;font-weight:600;font-family:'IBM Plex Mono',monospace;background:var(--divider);color:var(--text2);border-radius:999px;padding:2px 7px;">{{ it.badge }}</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="padding:12px;border-top:1px solid var(--divider);flex-shrink:0;">
      <div class="nvi" tabindex="0" title="Logout"><span class="ms">logout</span><span class="lbl">Logout</span></div>
    </div>
  </aside>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
    <header style="height:64px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;">
      <button onClick="{{ toggleCollapse }}" title="Toggle sidebar" style="width:36px;height:36px;display:grid;place-items:center;background:transparent;border:none;border-radius:8px;color:var(--muted);cursor:pointer;transition:background-color 120ms cubic-bezier(0.2,0,0,1),color 120ms cubic-bezier(0.2,0,0,1);" style-hover="background:var(--divider);color:var(--text)"><span class="ms" style="font-size:20px;">{{ collapseIcon }}</span></button>
      <div style="display:flex;align-items:center;gap:8px;width:340px;min-width:120px;flex-shrink:1;height:38px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0 12px;color:var(--muted);overflow:hidden;transition:border-color 160ms cubic-bezier(0.2,0,0,1);" style-hover="border-color:var(--muted2)">
        <span class="ms" style="font-size:18px;">search</span>
        <span style="font-size:13.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Search products, MRFs, suppliers…</span>
        <span style="font-size:11px;font-family:'IBM Plex Mono',monospace;border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--muted2);">⌘K</span>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <button style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:0 14px;height:38px;font-size:13.5px;font-weight:700;cursor:pointer;transition:background-color 120ms cubic-bezier(0.2,0,0,1),transform 120ms cubic-bezier(0.2,0,0,1);" style-hover="background:var(--primary-hover)" style-active="transform:scale(0.98)"><span class="ms" style="font-size:17px;">add</span>Add New</button>
        <button onClick="{{ toggleDark }}" title="Toggle dark mode" style="width:38px;height:38px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;transition:border-color 160ms cubic-bezier(0.2,0,0,1),color 160ms cubic-bezier(0.2,0,0,1);" style-hover="border-color:var(--primary);color:var(--primary-text)"><span class="ms" style="font-size:19px;">{{ modeIcon }}</span></button>
        <button title="Notifications" style="position:relative;width:38px;height:38px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;transition:border-color 160ms cubic-bezier(0.2,0,0,1),color 160ms cubic-bezier(0.2,0,0,1);" style-hover="border-color:var(--primary);color:var(--primary-text)"><span class="ms" style="font-size:19px;">notifications</span><span style="position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--primary);border:2px solid var(--surface);"></span></button>
        <div title="My account" style="display:flex;align-items:center;gap:10px;padding-left:4px;cursor:pointer;">
          <div style="width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;">CE</div>
          <div style="line-height:1.25;">
            <div style="font-size:13.5px;font-weight:700;">Ceddie</div>
            <div style="font-size:11.5px;color:var(--muted);">Owner</div>
          </div>
        </div>
      </div>
    </header>
    <main style="flex:1;overflow-y:auto;display:flex;flex-direction:column;">
      <div style="flex:1;padding:24px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
          <div>
            <div style="font-size:20px;line-height:28px;font-weight:800;">{{ pageTitle }}</div>
            <div style="margin-top:2px;font-size:13px;color:var(--muted);">{{ pageSub }}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <button title="Export PDF" style="width:36px;height:36px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:#B42318;cursor:pointer;transition:border-color 160ms cubic-bezier(0.2,0,0,1);" style-hover="border-color:var(--muted2)"><span class="ms" style="font-size:18px;">picture_as_pdf</span></button>
            <button title="Export Excel" style="width:36px;height:36px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:#12805C;cursor:pointer;transition:border-color 160ms cubic-bezier(0.2,0,0,1);" style-hover="border-color:var(--muted2)"><span class="ms" style="font-size:18px;">grid_on</span></button>
            <button style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:0 14px;height:38px;font-size:13.5px;font-weight:700;cursor:pointer;transition:background-color 120ms cubic-bezier(0.2,0,0,1),transform 120ms cubic-bezier(0.2,0,0,1);" style-hover="background:var(--primary-hover)" style-active="transform:scale(0.98)"><span class="ms" style="font-size:17px;">add</span>Add</button>
          </div>
        </div>
        <div style="margin-top:20px;min-height:420px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,0.04);display:grid;place-items:center;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted2);">‹ {{ pageTitle }} content — per-page styling lands in later steps ›</div>
        </div>
      </div>
      <div style="padding:12px 24px;border-top:1px solid var(--divider);font-size:12.5px;color:var(--muted);background:var(--surface);flex-shrink:0;">2026 © DRIM Inventory Management System</div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF6B2C&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#FF6B2C&quot;,&quot;#FE9F43&quot;,&quot;#092C4C&quot;,&quot;#155EEF&quot;]},&quot;startCollapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { dark: false, collapsed: false, active: "dashboard" };
  componentDidMount() {
    if (this.props.startCollapsed) this.setState({ collapsed: true });
    this.sync();
  }
  componentDidUpdate() { this.sync(); }
  sync() {
    document.body.classList.toggle("dark", this.state.dark);
    document.body.classList.toggle("nav-collapsed", this.state.collapsed);
    document.documentElement.style.setProperty("--primary", this.props.accent ?? "#FF6B2C");
  }
  renderVals() {
    const NAV = [
      ["Main", [["dashboard","Dashboard","grid_view",""],["activity","Activity Log","history",""]]],
      ["Inventory", [["inventory","Inventory","inventory_2",""],["products","Products","sell",""],["suppliers","Suppliers","local_shipping",""],["purchaseOrders","Purchase Orders","receipt_long","2"],["adjustments","Adjustments","tune",""]]],
      ["Stock", [["stock","Stock & MRFs","swap_vert","5"]]],
      ["People", [["technicians","Technicians","engineering",""],["users","Users","group",""]]],
      ["Admin", [["reports","Reports","description",""],["permissions","Permissions","admin_panel_settings",""],["settings","Settings","settings",""]]],
    ];
    const TITLES = {dashboard:"Dashboard",activity:"Activity Log",inventory:"Inventory",products:"Products/Materials",suppliers:"Suppliers",purchaseOrders:"Purchase Orders",adjustments:"Stock Adjustments",stock:"Stock & MRFs",technicians:"Technicians",users:"Users",reports:"Reports",permissions:"Role Permissions",settings:"Settings"};
    const SUBS = {dashboard:"Live overview of stock movement and alerts",activity:"What's happening across DRIM",inventory:"Stock on hand by product and category",products:"Master product catalog",suppliers:"Accredited supplier registry",purchaseOrders:"What's on order and not yet received",adjustments:"Manual stock count corrections with audit trail",stock:"Open material requests, receive (SI), and release (SO)",technicians:"Field personnel and their transactions",users:"System accounts and roles",reports:"Generate and export operational reports",permissions:"Configure what each role can access",settings:"Company profile and system configuration"};
    const a = this.state.active;
    const groups = NAV.map(([label, items]) => ({
      label,
      items: items.map(([seg, lb, icon, badge]) => ({
        label: lb, icon, badge,
        cls: seg === a ? "nvi on" : "nvi",
        go: () => this.setState({ active: seg }),
      })),
    }));
    return {
      groups,
      pageTitle: TITLES[a], pageSub: SUBS[a],
      toggleDark: () => this.setState(s => ({ dark: !s.dark })),
      toggleCollapse: () => this.setState(s => ({ collapsed: !s.collapsed })),
      modeIcon: this.state.dark ? "light_mode" : "dark_mode",
      collapseIcon: this.state.collapsed ? "last_page" : "first_page",
    };
  }
}
</script>
</body>
</html>
